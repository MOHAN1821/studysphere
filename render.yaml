# Render Blueprint: one always-on Docker web service + persistent disk.
# Gives you a permanent public HTTPS URL: https://<name>.onrender.com
# NOTE: persistent disks and "always on" need a paid plan (starter). The free plan
# sleeps after 15 min idle and wipes data on every restart - not suitable for real use.
services:
  - type: web
    name: smart-student-productivity-assistant
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: studysphere-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: AI_PROVIDER
        value: gemini
      - key: AI_API_KEY
        sync: false          # paste your key in the Render dashboard
      - key: WEB_CONCURRENCY
        value: "2"
      - key: GUNICORN_TIMEOUT
        value: "120"
